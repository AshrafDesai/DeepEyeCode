version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepeyecode-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./scans.db
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - scan_data:/app/data
    networks:
      - deepeye-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepeyecode-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deepeye-net

  prometheus:
    image: prom/prometheus:latest
    container_name: deepeyecode-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - deepeye-net

  grafana:
    image: grafana/grafana:latest
    container_name: deepeyecode-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - deepeye-net

volumes:
  scan_data:
  grafana_data:

networks:
  deepeye-net:
    driver: bridge